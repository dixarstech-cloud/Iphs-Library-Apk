name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copy the web app into www/
        run: |
          mkdir www
          rsync -a ./ www/ \
            --exclude '.git' --exclude '.github' --exclude 'www' --exclude 'node_modules' \
            --exclude 'android' --exclude '*.py' --exclude '*.db' --exclude '*.md' \
            --exclude 'wrangler.toml' --exclude 'gemini-proxy.js'
          ls www

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3

      - name: Create the Android project
        run: |
          npx cap init "IPHS School Library" com.iphs.library --web-dir www
          npx cap add android

      - name: Generate app icons
        run: |
          mkdir -p assets
          cp icon-512.png assets/icon-only.png
          npx capacitor-assets generate --android || echo "Icon step skipped, using default icon"

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IPHS-School-Library-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
